[profile.default]
src = "src"
out = "out"
libs = ["lib"]
evm_version = "cancun"

# For chains that enforce EIP-170's 24,576-byte contract size limit
# (Base, Base Sepolia, HyperEVM). Monad has no such limit and keeps using
# the default profile. Without the optimizer DelegateGovernance and
# SowellianGovernance are ~29.2 KB; with it every contract is under 15 KB.
#   FOUNDRY_PROFILE=size-limited forge build --sizes
#   FOUNDRY_PROFILE=size-limited forge script script/DeployDAOFactory.s.sol --rpc-url $BASE_RPC_URL --broadcast
[profile.size-limited]
via_ir = true
optimizer = true
optimizer_runs = 200

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
