# Slack app manifest for the Protean DAO bot.
# Create the app at https://api.slack.com/apps -> "Create New App" ->
# "From an app manifest", pick your workspace, paste this, then:
#   1. Basic Information -> App-Level Tokens -> generate one with the
#      connections:write scope -> that's SLACK_APP_TOKEN (xapp-...).
#
# To let any workspace install it ("Add to Slack"):
#   2. Replace YOUR-BOT-DOMAIN below with the bot's public address.
#   3. Basic Information -> App Credentials -> Client ID, Client Secret
#      -> SLACK_CLIENT_ID, SLACK_CLIENT_SECRET. Set SLACK_STATE_SECRET
#      and SLACK_PUBLIC_URL too (see .env.example).
#   4. Start the bot, then install into your own workspace by opening
#      <SLACK_PUBLIC_URL>/slack/install - the same link anyone else uses.
#   5. Manage Distribution -> Activate Public Distribution.
#
# Or, for one workspace only: skip 2-5, Install App -> Install to
# Workspace, and copy the Bot User OAuth Token -> SLACK_BOT_TOKEN (xoxb-...).
display_information:
  name: Protean DAO
  description: Run an on-chain DAO from a Slack channel
features:
  bot_user:
    display_name: Protean DAO
    always_online: true
  slash_commands:
    - command: /protean
      description: Protean DAO governance — try /protean help
      usage_hint: help | register <address> [model] | proposals | vote <id> for
      should_escape: false
oauth_config:
  redirect_urls:
    - https://YOUR-BOT-DOMAIN/slack/oauth_redirect
  scopes:
    bot:
      - commands          # the /protean slash command
      - chat:write        # proposal notifications in channels the bot is in
      - chat:write.public # ...and public channels it hasn't been invited to
      - users:read        # admin check for register/unregister
      - channels:read     # member_joined_channel events (welcome tokens)
      - groups:read       # ...in private channels too
settings:
  event_subscriptions:
    bot_events:
      - member_joined_channel   # auto-send welcome tokens on join
      - app_uninstalled         # forget a workspace's token when it removes the app
      - tokens_revoked          # ...or revokes it
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
